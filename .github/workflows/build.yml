name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Build static web app (no server)
        run: |
          cat > vite.config.apk.ts << 'VITE'
          import { defineConfig } from "vite";
          import { tanstackStart } from "@tanstack/react-start/plugin/vite";
          import viteReact from "@vitejs/plugin-react";
          import tailwindcss from "@tailwindcss/vite";

          export default defineConfig({
            resolve: { tsconfigPaths: true },
            plugins: [
              tailwindcss(),
              tanstackStart({ spa: { enabled: true } }),
              viteReact(),
            ],
          });
          VITE
          npx vite build --config vite.config.apk.ts
          cp dist/client/_shell.html dist/client/index.html

      - name: Wrap with Capacitor
        run: |
          mkdir wrapper && cd wrapper
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cp -r ../dist/client www
          cat > capacitor.config.json << 'CAP'
          {
            "appId": "com.callrejector.app",
            "appName": "Call Rejector",
            "webDir": "www"
          }
          CAP
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: wrapper/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: wrapper/android/app/build/outputs/apk/debug/*.apk
