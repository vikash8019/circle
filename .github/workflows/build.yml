name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Deployed site URL (e.g. https://circle.vercel.app)"
        required: true
        type: string
      app_name:
        description: "App name shown on phone"
        required: false
        default: "Circle"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Create Capacitor wrapper
        env:
          APP_URL: ${{ inputs.app_url }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          mkdir wrapper && cd wrapper
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir www
          echo '<!doctype html><html><body>Loading...</body></html>' > www/index.html
          node -e '
            const fs = require("fs");
            const cfg = {
              appId: "com.circle.app",
              appName: process.env.APP_NAME || "Circle",
              webDir: "www",
              server: { url: process.env.APP_URL, cleartext: false }
            };
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: wrapper/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: wrapper/android/app/build/outputs/apk/debug/*.apk
